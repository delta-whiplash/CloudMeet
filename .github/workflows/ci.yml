name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all

      - name: Verify configuration & deployment setup
        run: pnpm run verify-deployment

      - name: Run Svelte component type check
        run: pnpm run check

      - name: Run Vitest test suite
        run: pnpm test

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Initialize D1 Local Schema for E2E
        run: pnpm run db:init

      - name: Provision E2E dev vars
        run: printf 'DASHBOARD_DEMO=1\nJWT_SECRET=ci-e2e-test-secret\n' > .dev.vars

      - name: Run Playwright E2E Non-Regression Suite
        run: pnpm run test:e2e

      - name: Build production bundle
        run: pnpm run build
